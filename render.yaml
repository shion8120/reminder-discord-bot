services:
  - type: worker
    name: reminder-discord-bot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: BOT_DATA_DIR
        value: /var/data
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: shion8120/gadget-feed
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: POLL_MINUTES
        value: "30"
