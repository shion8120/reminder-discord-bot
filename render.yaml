services:
  - type: worker
    name: reminder-discord-bot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run render-start
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: BOT_DATA_DIR
        value: /var/data
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: REMINDER_CHANNEL_ID
        sync: false
      - key: BOT_TIMEZONE
        value: Asia/Tokyo
