services:
  - type: web
    name: gadget-watcher
    runtime: node
    plan: starter
    region: oregon
    branch: gadget-watcher
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: watcher-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: BOT_DATA_DIR
        value: /var/data
      - key: POLL_MINUTES
        value: "60"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
